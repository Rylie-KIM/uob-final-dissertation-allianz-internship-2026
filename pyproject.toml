[project]
name = "allianz-sfp"
version = "0.1.0"
description = "Identifying and mitigating self-fulfilling-prophecy loops in the FTTL total-loss model — analysis environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "xgboost>=2.0",
]

# The analysis env is the EVOLVING tier: grow it with `uv add <pkg>` as the research needs
# (e.g. dowhy, econml, statsmodels, matplotlib, jupyter). Per-version model envs live under
# src/model/envs/<v>/ and are managed separately — never added here. See src/ENV_MANAGEMENT.md.
